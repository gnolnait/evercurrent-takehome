# Scripted ground truth for the Kestrel K2 warehouse AMR, ten working days from EVT-2 exit
# to the DVT-1 build. The scenario ids S1 to S15 and N1 to N5 are the ones that
# docs/plans/m1-store-replay.md B3.5 names.
name: kestrel
program: Kestrel K2
description: A compact autonomous mobile robot that moves totes between racks and packing stations in a warehouse.
workspace_url: https://kestrel-k2.slack.com
timezone: America/Los_Angeles
start_date: 2026-10-12
days: 10

project:
  project_id: kestrel-k2
  name: Kestrel K2
  phases:
    - {phase: EVT, from_date: 2026-08-03}
    - {phase: DVT, from_date: 2026-10-22}
  gates:
    - id: G-EVT2-EXIT
      name: EVT-2 exit review
      date: 2026-10-12
      buffer_days: 0
      checklist:
        - {id: G-EVT2-EXIT.review, task: Hold the EVT-2 exit review, owner: EM, expected_cadence_days: 5}
        - {id: G-EVT2-EXIT.actions, task: Close the EVT-2 exit actions, owner: ME, expected_cadence_days: 3}
    - id: G-TR1
      name: Top-cover tooling and texture release (PN-51010)
      date: 2026-10-20
      buffer_days: 0
      priority: high
      checklist:
        - {id: G-TR1.dfm, task: Close the top-cover DFM review, owner: ME, expected_cadence_days: 2}
        - {id: G-TR1.texture, task: Release texture on PN-51010, owner: ME, expected_cadence_days: 3}
    - id: G-DVT1
      name: DVT-1 go/no-go
      date: 2026-10-22
      buffer_days: 7
      priority: critical
      checklist:
        - {id: G-DVT1.thermal, task: Close the TST-THM-02 thermal review, owner: EE, expected_cadence_days: 2, priority: high}
        - {id: G-DVT1.emc, task: Pass the TST-EMC-01 EMC pre-scan, owner: EE, expected_cadence_days: 2, priority: high}
        - {id: G-DVT1.safety, task: Validate e-stop timing (TST-SAF-01) on the DVT firmware, owner: FW, expected_cadence_days: 3, priority: high}
        - {id: G-DVT1.fai, task: Sign off FAI on DVT-1 mechanical parts, owner: ME, expected_cadence_days: 2}
        - {id: G-DVT1.ctb, task: Reach clear-to-build for 40 units, owner: supply_chain, expected_cadence_days: 1}
        - {id: G-DVT1.battery, task: Confirm the DVT-1 battery ship plan, owner: supply_chain, expected_cadence_days: 2, priority: high}
        - {id: G-DVT1.review, task: Hold the DVT-1 go/no-go review, owner: EM, expected_cadence_days: 5}

channels:
  - {id: C0KPROG, name: kestrel-program, purpose: "Program status, schedule, gate reviews and decisions"}
  - {id: C0ENGME, name: eng-mech, purpose: "CAD, drawings, tolerances, tooling and mechanical FA"}
  - {id: C0ENGEF, name: eng-elec-fw, purpose: "PCBA, harness, EMC, BMS, firmware releases and the safety chain"}
  - {id: C0SUPCH, name: supply-chain, purpose: "RFQs, POs, shipments, allocation and clear-to-build"}
  - {id: C0DVT1B, name: dvt1-build, purpose: "DVT-1 build log, test results, FA tickets and yield"}
  - {id: C0EXTCM, name: ext-sunrise-cm, purpose: Shared channel with Sunrise Precision Mfg}
  - {id: C0PLMFD, name: plm-feed, purpose: "Posts from PLM, the program schedule and document control"}
  - {id: C0LEADS, name: kestrel-leads, purpose: "Program leads only: customer asks, budget and staffing", private: true}

