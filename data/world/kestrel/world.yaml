events:
  # Day 1, Monday 2026-10-12
  - id: PLM-0142
    day: 1
    channel: C0PLMFD
    poster: B0PLM01
    kind: bom_change
    scenario: S2
    summary: PLM releases ECO-0142, which moves harness PN-31010 from Rev B to Rev C.
    claims:
      - {entity: ECO-0142, attribute: status, value: released}
      - {entity: PN-31010, attribute: rev, value: C}
    affected_roles: [EE, supply_chain]
    known_by: {U0EE01: 1}
  - id: SCHED-1
    day: 1
    channel: C0PLMFD
    poster: B0SCH01
    kind: fyi
    scenario: S12
    summary: The schedule sync shows top-cover PN-51010 T1 on 2026-10-14 and G-DVT1 on 2026-10-22.
    claims:
      - {entity: PN-51010, attribute: gate_date, value: "2026-10-14"}
      - {entity: G-DVT1, attribute: gate_date, value: "2026-10-22"}
    affected_roles: [PM, EM, ME]
    known_by: {U0ME01: 1, U0SC01: 1}
  - id: DOC-1
    day: 1
    channel: C0PLMFD
    poster: B0DOC01
    kind: fyi
    scenario: S4
    summary: Document control shows the CM drawing pack for PN-11020 issued to Sunrise at Rev B.
    claims:
      - {entity: DOC-11020-CM, attribute: rev, value: B}
    affected_roles: [ME]
    known_by: {U0ME01: 1}
  - id: EVT2-EXIT
    day: 1
    channel: C0KPROG
    poster: U0EM01
    kind: decision
    scenario: S7
    summary: The EVT-2 exit review passes with actions, and deviation DEV-0007 expires today.
    claims:
      - {entity: G-EVT2-EXIT, attribute: status, value: passed with actions}
      - {entity: DEV-0007, attribute: status, value: expired}
    tasks:
      - {task: G-EVT2-EXIT.review, effect: done}
      - {task: G-EVT2-EXIT.actions, effect: evidence}
    affected_roles: [ME, EE, FW, supply_chain, EM, PM]
    known_by: {U0ME01: 1, U0EE01: 1, U0FW01: 1, U0SC01: 1, U0EM01: 1, U0PM01: 1}

  # Day 2, Tuesday 2026-10-13
  - id: S1-AGREE
    day: 2
    channel: C0ENGME
    poster: U0ME01
    kind: decision
    scenario: S1
    summary: ME and EE agree in a thread to raise the LiDAR mount PN-11051 by 8 mm, and nobody files an ECO.
    claims:
      - {entity: PN-11051, attribute: spec_param, value: mount height +8 mm}
    affected_roles: [ME, EE, supply_chain]
    must_see_for: [U0SC01, U0CM01, U0EM01]
    known_by: {U0ME01: 2, U0EE01: 2}
    noise: {indirection: true}
  - id: N1-TORQUE
    day: 2
    channel: C0EXTCM
    poster: U0CM01
    kind: distractor
    scenario: N1
    summary: The CM asks for the M5 fastener torque spec and the ME answers within 15 minutes.
    known_by: {U0CM01: 2, U0ME01: 2}
  - id: PLM-11020C
    day: 2
    channel: C0PLMFD
    poster: B0PLM01
    kind: spec_change
    scenario: S4
    summary: PLM releases chassis base PN-11020 Rev C, which moves the hole pattern for the Orin carrier standoffs.
    claims:
      - {entity: PN-11020, attribute: rev, value: C}
    affected_roles: [ME, supply_chain]
    known_by: {U0ME01: 2}
  - id: S14-LTB
    day: 2
    channel: C0SUPCH
    poster: U0SC01
    kind: risk
    scenario: S14
    summary: The six EVT spare compute units use the Xavier NX carrier, whose LTB has passed, so new POs are NCNR.
    claims:
      - {entity: PN-42011, attribute: status, value: "LTB passed, NCNR"}
    affected_roles: [FW, EM]
    must_see_for: [U0FW01, U0EM01]
    known_by: {U0SC01: 2, U0EM01: 3}

  - id: S3-THERMAL-RUN1
    day: 2
    channel: C0ENGEF
    poster: U0EE01
    kind: fyi
    scenario: S3
    summary: The first TST-THM-02 thermal soak run is marginal on the motor driver, and the EE plans a rerun with the new vent layout.
    claims:
      - {entity: TST-THM-02, attribute: status, value: run 1 marginal}
    tasks:
      - {task: G-DVT1.thermal, effect: evidence}
    affected_roles: [EE, ME]
    known_by: {U0EE01: 2, U0ME01: 2}

  # Day 3, Wednesday 2026-10-14
  - id: S2-PO
    day: 3
    channel: C0SUPCH
    poster: U0SC01
    kind: risk
    scenario: S2
    summary: SC places PO-45002211 for 50 harnesses PN-31010 at Rev B, after ECO-0142 released Rev C.
    claims:
      - {entity: PO-45002211, attribute: status, value: placed}
      - {entity: PO-45002211, attribute: qty, value: "50"}
      - {entity: PN-31010, attribute: rev, value: B, contradicts: [PLM-0142]}
    tasks:
      - {task: G-DVT1.ctb, effect: evidence}
    affected_roles: [supply_chain, EE]
    must_see_for: [U0SC01, U0EE01]
    known_by: {U0SC01: 3}
  - id: S6-EMC
    day: 3
    channel: C0ENGEF
    poster: U0EE01
    kind: blocker
    scenario: S6
    summary: The EMC pre-scan fails by about 6 dB at 150 MHz on the motor-phase harness, and the fix needs PN-31010 Rev D.
    claims:
      - {entity: TST-EMC-01, attribute: status, value: fail}
      - {entity: PN-31010, attribute: rev, value: D, contradicts: [PLM-0142, S2-PO]}
    tasks:
      - {task: G-DVT1.emc, effect: evidence}
    affected_roles: [EE, supply_chain, EM, PM]
    must_see_for: [U0SC01, U0EM01, U0PM01]
    known_by: {U0EE01: 3, U0FW01: 3}
  - id: S12-SLIP
    day: 3
    channel: C0EXTCM
    poster: U0CM01
    kind: schedule_change
    scenario: S12
    summary: The CM says the molder slips top-cover PN-51010 T1 from 2026-10-14 to 2026-10-21 for slider rework.
    claims:
      - {entity: PN-51010, attribute: gate_date, value: "2026-10-21", contradicts: [SCHED-1]}
    affected_roles: [PM, EM, ME]
    must_see_for: [U0PM01, U0EM01, U0ME01]
    known_by: {U0CM01: 3, U0SC01: 3}
    noise: {delayed_crosspost: true}
  - id: N5-LUNCH
    day: 3
    channel: C0KPROG
    poster: U0FW01
    kind: distractor
    scenario: N5
    summary: Chatter about the 3D-printer queue and lunch.
  - id: ASK-SAF
    day: 3
    channel: C0ENGEF
    poster: U0EM01
    kind: ask
    summary: The EM asks FW when TST-SAF-01 reruns on the DVT firmware, and nobody answers.
    ask: {of: U0FW01, answered_day: null}
    affected_roles: [FW, EE, EM]
    must_see_for: [U0FW01]
    known_by: {U0EM01: 3, U0FW01: 3}

  # Day 4, Thursday 2026-10-15
  - id: S1-CUT
    day: 4
    channel: C0EXTCM
    poster: U0CM01
    kind: fyi
    scenario: S1
    summary: The CM starts machining 40 LiDAR brackets PN-11051 at Rev A for DVT-1.
    claims:
      - {entity: PN-11051, attribute: rev, value: A}
    affected_roles: [ME, supply_chain, EM]
    must_see_for: [U0ME01, U0SC01, U0EM01]
    known_by: {U0CM01: 4, U0SC01: 4}
  - id: S5-MLCC
    day: 4
    channel: C0SUPCH
    poster: U0SC01
    kind: blocker
    scenario: S5
    summary: The 100 V MLCC on motor driver PN-21030 goes into allocation with no ship date, and the Samsung alternate is not on the AML.
    claims:
      - {entity: C-MLCC-100V, attribute: lead_time, value: "allocation, no ship date"}
    tasks:
      - {task: G-DVT1.ctb, effect: evidence}
    affected_roles: [EE, EM]
    must_see_for: [U0EE01, U0EM01]
    known_by: {U0SC01: 4, U0EE01: 4}
  - id: S9-FA
    day: 4
    channel: C0DVT1B
    poster: U0ME01
    kind: spec_change
    scenario: S9
    summary: The FA-0031 corrective action moves PN-11034 to Rev C with a keyed shaft, but 40 Rev B brackets are already machined.
    claims:
