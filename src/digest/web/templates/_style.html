<style>
  :root {
    --cream: #FCF4EE; --ink: #0B1C20; --muted: #5B6669; --faint: #8A9396;
    --accent: #DA7C2F; --accent-dark: #B9631F; --peach: #FBE3D2;
    --line: #EADFD6; --green: #2F8F5B; --red: #D64545;
    --shadow: 0 1px 2px rgba(11, 28, 32, 0.06), 0 6px 18px rgba(11, 28, 32, 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 32px 48px; background: var(--cream); color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 14px; font-weight: 400; line-height: 1.45;
  }
  h1, h2, h3, h4 { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  p { margin: 0; }

  /* Header */
  .top { margin-bottom: 4px; }
  .brand { font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .top h1 { font-weight: 300; font-size: 30px; line-height: 1.15; margin: 2px 0 4px; }
  .meta { font-size: 14px; }
  .meta .sep { color: var(--faint); margin: 0 8px; }
  .top .note { color: var(--muted); font-size: 13px; margin-top: 2px; max-width: 64rem; }

  /* Panels and cards */
  .panel { margin-top: 24px; }
  .panel > h2 { font-weight: 300; font-size: 24px; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 20px 22px; min-width: 0; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

  /* Pills, badges and buttons */
  .pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
          border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .pill.must { background: var(--accent); color: #fff; }
  .pill.role { background: var(--peach); color: var(--accent-dark); }
  .badge { display: inline-block; min-width: 26px; text-align: center; font-weight: 600; font-size: 13px;
           border-radius: 999px; padding: 2px 9px; background: var(--ink); color: #fff; }
  .badge.zero { background: var(--line); color: var(--muted); }
  button { font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 999px; padding: 7px 18px;
           border: 1.5px solid var(--accent); background: var(--accent); color: #fff; }
  button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.outline { background: transparent; color: var(--accent-dark); }
  button.outline:hover { background: var(--peach); }
  select, input[type="date"] {
    font: inherit; font-size: 13px; color: var(--ink); background: #fff; width: 100%;
    border: 1px solid #D9CCC2; border-radius: 8px; padding: 6px 8px;
  }
  select:focus, input:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Auto width lets each select fit its longest option; the label column stretches it. */
  .edit select, .edit input[type="date"] { width: auto; }

  /* Edit strip */
  .strip { margin-top: 16px; }
  .strip-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .strip-row > .label { margin-right: 4px; }
  .strip-row .reset { margin-left: auto; }
  .edit-pill { position: relative; margin: 0; font-size: 13px; }
  .edit-pill > summary { list-style: none; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink);
                         background: #fff; border: 1px solid #E3D3C6; border-radius: 999px; padding: 6px 14px;
                         box-shadow: 0 1px 2px rgba(11, 28, 32, 0.05); white-space: nowrap; }
  .edit-pill > summary::-webkit-details-marker { display: none; }
  .edit-pill > summary::after { content: ""; display: inline-block; margin-left: 8px; vertical-align: 2px;
                                border: 4px solid transparent; border-top-color: var(--accent-dark); border-bottom: 0; }
  .edit-pill > summary:hover { border-color: var(--accent); }
  .edit-pill[open] > summary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .edit-pill[open] > summary::after { border-top-color: #fff; }
  .edit-pill > form { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10;
                      width: max-content; min-width: 15rem; max-width: 24rem; }
  .edit-pill.end > form { left: auto; right: 0; }
  .refusal, .notice { border-radius: 10px; padding: 12px 16px 12px 36px; margin: 10px 0 0; position: relative; }
  .refusal { background: var(--ink); color: #fff; }
  .refusal::before, .notice::before { content: ""; position: absolute; left: 16px; top: 18px; width: 8px; height: 8px; border-radius: 50%; }
  .refusal::before { background: var(--red); }
  .notice { background: #fff; border: 1px solid var(--line); }
  .notice::before { background: var(--accent); }
  .made { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .made ol { display: flex; gap: 6px; flex-wrap: wrap; counter-reset: edit; }
  .made li { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 13px; counter-increment: edit; }
  .made li::before { content: counter(edit) "."; color: var(--accent-dark); font-weight: 600; margin-right: 6px; }
  .made .none { color: var(--muted); font-size: 13px; }
  .edit { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
          box-shadow: 0 2px 4px rgba(11, 28, 32, 0.08), 0 12px 32px rgba(11, 28, 32, 0.16); }
  .fields { display: flex; flex-direction: column; gap: 8px; }
  .fields label { font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .edit button { align-self: flex-start; padding: 6px 18px; }

  /* Digest cards */
  .reader-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .reader-head h3 { font-weight: 400; font-size: 20px; }
  .reader-window { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .section { margin-top: 18px; }
  .section > h4 { padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .lines > li { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid transparent; background: #FDFAF7; }
  .lines > li.must { border-left-color: var(--accent); background: #FEF6F0; }
  .lines > li.absent { background: var(--ink); color: #fff; }
  .line-top { display: flex; align-items: flex-start; gap: 8px; }
  .line-top .heading { flex: 1; font-weight: 600; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-top: 6px; }
  .summary { color: var(--muted); margin-top: 3px; }
  .absent .summary { color: #C4CDCF; }
  .source { margin-top: 4px; font-size: 11px; color: var(--faint); word-break: break-all; }
  .why { margin-top: 6px; font-size: 12px; }
  .why > summary { cursor: pointer; color: var(--accent-dark); font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .absent .why > summary { color: #F2B98A; }
  .why > p { margin-top: 4px; color: var(--muted); }
  .absent .why > p { color: #C4CDCF; }
  .hidden { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); margin-top: 16px; }

  /* Diff cards */
  .diff h4 { margin: 16px 0 8px; }
  .diff-count { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .diff ul > li { margin-bottom: 8px; position: relative; padding-left: 18px; }
  .added > li::before { content: "+"; position: absolute; left: 0; top: -1px; font-weight: 600; color: var(--green); }
  .added .t { font-weight: 600; }
  .removed > li { color: var(--faint); }
  .removed > li::before { content: "-"; position: absolute; left: 1px; top: -1px; font-weight: 600; color: var(--faint); }
  .removed .t { text-decoration: line-through; }
  .where { color: var(--muted); font-size: 12px; }
  .diff ul.changed > li, .diff ul.reworded > li { padding-left: 0; }
  .changed .t { font-weight: 600; display: block; }
  .notes { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .note-pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--ink); color: #fff; white-space: nowrap; }
  .reason { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .before .reason .label, .after .reason .label { display: inline; margin: 0 6px 0 0; color: var(--accent-dark); }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .before, .after { border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .before { background: var(--peach); }
  .after { background: #fff; border: 1px solid var(--line); }
  .before .label, .after .label { display: block; margin-bottom: 3px; }

  /* World */
  .world details { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 12px 18px; margin: 0 0 10px; font-size: 13px; }
  .world details > summary { cursor: pointer; font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--ink); }
  .wide { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
       border-bottom: 1px solid var(--line); padding: 6px 8px; }
  td { padding: 6px 8px; border-bottom: 1px solid #F3ECE6; vertical-align: top; }

  /* Messages and seed */
  textarea, input[type="text"] {
    font: inherit; font-size: 13px; color: var(--ink); background: #fff; width: 100%;
    border: 1px solid #D9CCC2; border-radius: 8px; padding: 6px 8px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .result { white-space: pre-line; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .actions form { margin: 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 12px; max-width: 64rem; }
  .channel { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 12px 18px; margin: 0 0 10px; }
  .channel > summary { cursor: pointer; font-weight: 600; font-size: 13px; letter-spacing: 0.04em; }
  .messages > li { padding: 8px 10px; border-radius: 8px; margin-top: 8px; background: #FDFAF7; }
  .messages > li.reply { margin-left: 24px; }
  .messages > li.posted { border-left: 3px solid var(--green); }
  .msg-head { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .msg-head .who { font-weight: 600; color: var(--ink); }
  .msg-text { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .files { font-size: 12px; color: var(--faint); margin-top: 3px; word-break: break-all; }
  .msg-edit { margin-top: 6px; font-size: 12px; }
  .msg-edit > summary { cursor: pointer; color: var(--accent-dark); font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .msg-edit .edit { box-shadow: none; border: 1px solid var(--line); margin-top: 6px; max-width: 40rem; }
  .post { max-width: 40rem; margin-bottom: 12px; }
  .curated li { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .curated form { margin: 0; }

  @media (max-width: 900px) {
    body { padding: 20px 16px 40px; }
    .grid3, .pair { grid-template-columns: minmax(0, 1fr); }
    .strip-row .reset { margin-left: 0; }
    .edit-pill > form, .edit-pill.end > form { position: static; margin-top: 8px; max-width: none; }
  }
</style>
