# Run with prek (https://github.com/j178/prek), a drop-in pre-commit runner:
#   uv tool install prek && prek install && prek install --hook-type pre-push
# Commit: fast, auto-fixing checks and the token scan. Push: the type check, the import
# contract, the test suite and the merged-PR check.
# CI runs ruff and every pre-push gate except pr-not-merged, plus gitleaks, which has no
# local hook. See .claude/rules/ci-workflows.md.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
# notes/, cassettes and uv.lock are skipped per hook, not globally, so the secret
# scans (detect-private-key, no-secrets) still read them.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        exclude: ^(notes/|data/cassettes/|uv\.lock$)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        exclude: ^(notes/|data/cassettes/|uv\.lock$)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(notes/|data/cassettes/|uv\.lock$)
      - id: trailing-whitespace
        exclude: ^(notes/|data/cassettes/|uv\.lock$)
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        exclude: ^(notes/|data/cassettes/|uv\.lock$)
      - id: check-toml
        exclude: ^(notes/|data/cassettes/|uv\.lock$)
      - id: check-json
        exclude: ^(notes/|data/cassettes/|uv\.lock$)
      - id: check-added-large-files
        exclude: ^(notes/|data/cassettes/|uv\.lock$)
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-merge-conflict
        exclude: ^(notes/|data/cassettes/|uv\.lock$)

  - repo: local
    hooks:
      - id: agents-md-sync
        name: CLAUDE.md is a copy of AGENTS.md
        entry: python -c "import filecmp,sys; sys.exit(0 if filecmp.cmp('AGENTS.md','CLAUDE.md',shallow=False) else 1)"
        language: system
        pass_filenames: false
        files: ^(AGENTS|CLAUDE)\.md$
      - id: no-secrets
        name: no project tokens in staged files
        entry: uv run python tools/check_secrets.py
        language: system
        types: [text]
      - id: pr-not-merged
        name: the branch's PR has not merged already
        entry: uv run python tools/check_pr_open.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true  # prek hides a passing hook's output, and the fail-open warning
        stages: [pre-push]
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: lint-imports
        name: import-linter (import contracts)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest (replay mode)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: hook-guards
        name: Claude Code hook guard tests
        entry: bash -c 'cd .claude/hooks && uv run --project ../.. python -m pytest -q'
        language: system
        pass_filenames: false
        files: ^\.claude/(hooks|settings\.json)
        stages: [pre-push]
