# Constants SPEC section 5 names. Phase re-weighting of the role table lands in M3 proper.
triage:
  # A thread is kept when the classifier's probability is at least 1 / (1 + miss_cost_ratio):
  # a missed thread costs ten false keeps. Revisited after the first twenty golden threads.
  miss_cost_ratio: 10
absence:
  # Working days after which an ask with no reply from the person asked is an absence.
  ask_reply_cadence_days: 2
daily:
  # How much a role cares about an item type, before ownership and severity
  # (M3 demo slice, plan B5.4). A missing entry counts as 0.5.
  role_priors:
    ME: {decision: 0.9, blocker: 1.0, risk: 0.8, schedule_change: 0.7, spec_change: 1.0, bom_change: 0.8, ask: 0.8, fyi: 0.4, absence: 0.9}
    EE: {decision: 0.9, blocker: 1.0, risk: 0.8, schedule_change: 0.7, spec_change: 1.0, bom_change: 0.7, ask: 0.8, fyi: 0.4, absence: 0.9}
    FW: {decision: 0.8, blocker: 1.0, risk: 0.7, schedule_change: 0.6, spec_change: 0.9, bom_change: 0.4, ask: 0.8, fyi: 0.4, absence: 0.9}
    supply_chain: {decision: 0.8, blocker: 1.0, risk: 0.9, schedule_change: 0.9, spec_change: 0.6, bom_change: 1.0, ask: 0.8, fyi: 0.4, absence: 0.9}
    EM: {decision: 1.0, blocker: 1.0, risk: 1.0, schedule_change: 1.0, spec_change: 0.7, bom_change: 0.6, ask: 0.7, fyi: 0.5, absence: 1.0}
    PM: {decision: 1.0, blocker: 0.9, risk: 1.0, schedule_change: 1.0, spec_change: 0.6, bom_change: 0.6, ask: 0.6, fyi: 0.5, absence: 0.9}
  min_score: 0.15
