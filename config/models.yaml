# Logical model name to concrete model id, per backend (D15). Cassette keys use the
# logical name, so a change here does not invalidate a recording.
# Checked 2026-10-09: Anthropic ids from the claude-api skill model table (cached
# 2026-10-06); OpenRouter ids from GET https://openrouter.ai/api/v1/models. Each
# OpenRouter id lists response_format and structured_outputs.
# The anthropic_api backend serves Claude only, so render and judge use Claude there.
# The different-family renderer and judge (D12) need the openrouter backend.

extract:
  anthropic_api: claude-opus-5-5
  openrouter: anthropic/claude-opus-5.5
adjudicate:
  anthropic_api: claude-opus-5-5
  openrouter: anthropic/claude-opus-5.5
render:
  anthropic_api: claude-opus-5-5
  openrouter: openai/gpt-5.5
judge:
  anthropic_api: claude-opus-5-5
  openrouter: openai/gpt-5.5
classify:
  anthropic_api: claude-haiku-5-5
  openrouter: anthropic/claude-haiku-5.5
