[project]
name = "digest"
version = "0.1.0"
description = "Role- and phase-aware daily Slack digest for hardware engineering teams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
slack = [
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]
# Corpus renderer only: a different model family writes the synthetic Slack text than
# the one that extracts it (docs/decisions.md D12).
corpus = [
    "openai>=1.60",
]

[project.scripts]
digest = "digest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "time-machine>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
]
# No respx / pytest-httpx: anthropic 1.x runs on httpx2 and those mocks fail silently;
# the LLM layer is tested through the SDK-boundary cassette (docs/decisions.md D9) and
# Slack retries through slack_sdk's injectable retry_handlers.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:digest.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ported agent tooling keeps its own style and test suite (`just test-hooks`).
extend-exclude = [".claude", "dev-kit", "notes", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["digest"]
mypy_path = "src"
