[project]
name = "digest"
version = "0.1.0"
description = "Role- and phase-aware daily Slack digest for hardware engineering teams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
slack = [
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]

[project.scripts]
digest = "digest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "time-machine>=2.16",
    "ruff>=0.8",
    # Pinned: ty is pre-1.0 and its rule set moves between releases.
    "ty==0.0.84",
    "types-pyyaml>=6.0.12.20260906",
    "import-linter>=2.15",
]
# No respx / pytest-httpx: anthropic 1.x runs on httpx2 and those mocks fail silently;
# the LLM layer is tested through the SDK-boundary cassette (docs/decisions.md D9) and
# Slack retries through slack_sdk's injectable retry_handlers.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:digest.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ported agent tooling keeps its own style and test suite (`just test-hooks`).
extend-exclude = [".claude", "dev-kit", "notes", "data"]

[tool.ruff.lint]
# ANN restores the "every def is annotated" check that mypy --strict provided and ty
# does not (ty checks types it can see; it has no rule for a missing annotation).
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.flake8-bugbear]
# typer declares options as call defaults; B008 would flag every non-str option.
extend-immutable-calls = ["typer.Option"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
# Warnings fail the gate, so a diagnostic never lingers as "just a warning".
error-on-warning = true

[tool.importlinter]
root_package = "digest"
include_external_packages = true

# Adapters above functions above shared types (docs/decisions.md D20). A `|` layer holds
# independent siblings.
[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "digest.cli",
    "digest.replay",
    "digest.store | digest.llm | digest.world",
    "digest.project",
    "digest.models | digest.settings",
]

# Every model call goes through digest.llm, so cassettes capture all of them.
[[tool.importlinter.contracts]]
name = "anthropic sdk only inside digest.llm"
type = "forbidden"
source_modules = ["digest"]
forbidden_modules = ["anthropic"]
ignore_imports = ["digest.llm.* -> anthropic"]
allow_indirect_imports = true
